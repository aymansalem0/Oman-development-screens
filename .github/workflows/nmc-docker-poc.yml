name: NMC Docker POC validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose configuration
        run: docker compose config --quiet
      - name: Build Angular and AI proxy images
        run: docker compose build nmc ai-proxy
      - name: Start local POC
        run: docker compose up -d --wait
      - name: Smoke test Angular and proxy
        run: |
          curl --fail --silent --show-error http://127.0.0.1:4200/ | grep -qi '<html'
          curl --fail --silent --show-error http://127.0.0.1:4200/api/ai/health | grep -q '"aiConfigured":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:4200/api/ai/execute/a01)" = "503"
      - name: Logs if failing
        if: failure()
        run: docker compose logs --tail=100
      - name: Shutdown
        if: always()
        run: docker compose down --volumes
