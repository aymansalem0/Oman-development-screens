server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep credentials on the server-side proxy, not in Angular.
    location /api/ai/ {
        proxy_pass http://ai-proxy:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
        client_max_body_size 16m;
    }

    # Smart Inspection APIs (candidate targeting + existing ERP scheduling).
    # These must never fall through to Angular index.html.
    location /api/si/ {
        proxy_pass http://ai-proxy:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
        client_max_body_size 16m;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
    }
}
