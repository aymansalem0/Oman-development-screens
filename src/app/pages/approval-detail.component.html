<section class="detail-page">
  <div class="detail-title-row">
    <div>
      <div class="title-with-status">
        <h1>{{ lang.t('serviceTitle') }}</h1>
        <span class="status-pill awaiting">{{ lang.t('awaitingStatusLong') }}</span>
        <button class="enter-spec-button" type="button" (click)="openSpecifications()">
          {{ lang.isArabic ? '→' : '←' }}&nbsp;&nbsp; {{ lang.t('enterSpecifications') }}
        </button>
      </div>
      <p>{{ lang.t('serviceSubtitle') }}</p>
    </div>

    <div class="decision-actions">
      <button class="send-button">✓&nbsp; {{ lang.t('send') }}</button>
      <button class="reject-button">×&nbsp; {{ lang.t('reject') }}</button>
    </div>
  </div>

  <section class="request-data-panel">
    <div class="request-data-title">{{ lang.t('requestData') }}</div>

    <div class="detail-row" *ngFor="let row of rows">
      <div class="detail-label">{{ lang.t(row.labelKey) }}</div>
      <div class="detail-value">{{ displayValue(row) }}</div>
    </div>
  </section>

  <app-specifications-modal
    *ngIf="showSpecifications"
    (closed)="closeSpecifications()"
    (saved)="onSpecificationsSaved($event)"
  ></app-specifications-modal>
</section>
