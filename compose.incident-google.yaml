# NMC POC incidents. Reuses the EXISTING Google PSC service account JSON
# mounted by compose.google-psc.yaml, provided that same client_email has
# EDITOR access to the incident spreadsheet (AI results are append-only).
# You DO NOT need a second JSON key or a new service-account identity.
#
# If a different Google SA is required later, override
# NMC_INCIDENT_CREDENTIALS_PATH and mount it through an additional overlay.
services:
  ai-proxy:
    environment:
      NMC_INCIDENT_SHEET_ID: ${NMC_INCIDENT_SHEET_ID:-1fl6rCjHNTPKZTeS76PLSy_ylrClLQQ0Yvq12A7nhfy8}
      NMC_INCIDENT_CREDENTIALS_PATH: /run/secrets/nmc-psc-google.json
      # Incident triage reuses the existing Airia A01/A02 pipelines and
      # AIRIA_MENA_KEY from the base application configuration.
      # No separate OpenAI/Ollama model, credentials or pipeline IDs.
      # Optional scheduled AI triage: OFF by default; each row also requires
      # AI_Review_Request=YES. Max 1-5 calls per cycle, interval >=5 minutes.
      NMC_INCIDENT_AUTO_TRIAGE_ENABLED: ${NMC_INCIDENT_AUTO_TRIAGE_ENABLED:-false}
      NMC_INCIDENT_AUTO_INTERVAL_MINUTES: ${NMC_INCIDENT_AUTO_INTERVAL_MINUTES:-15}
      NMC_INCIDENT_AUTO_MAX_PER_CYCLE: ${NMC_INCIDENT_AUTO_MAX_PER_CYCLE:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
